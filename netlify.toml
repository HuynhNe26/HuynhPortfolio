# ==============================================================================
# Netlify Configuration - Nguyễn Hoàng Huynh Portfolio
# Monorepo setup with Next.js App Router (frontend workspace)
# ==============================================================================

[build]
  # When building from monorepo root, target the Next.js frontend workspace
  command = "npm run build --workspace frontend"
  # Next.js production build output directory relative to repository root
  publish = "frontend/.next"

[build.environment]
  # Use Node.js 22 to match package.json engine requirements (>=22.14.0)
  NODE_VERSION = "22"
  # Disable Next.js telemetry for faster CI builds
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify Next.js Runtime plugin (supports Next.js App Router, SSR & API routes)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security & performance headers across all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

# Static assets caching (Next.js immutable chunks)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static project media caching
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Public images caching
[[headers]]
  for = "/avatar.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
